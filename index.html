<!DOCTYPE html>
<html lang="ru">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>WpXMLGenerator</title>
	<!--Стили-->
	<link rel="stylesheet" href="/css/bootstrap.min.css">
	<link rel="stylesheet" href="/css/style.css">
	<!--end:Стили-->
</head>
<body class="h-100">
	<aside>
		<div class="offcanvas offcanvas-start" data-bs-scroll="true" tabindex="-1" id="offcanvasWithBothOptions" aria-labelledby="offcanvasWithBothOptionsLabel">
			<div class="offcanvas-header">
				<h5 class="offcanvas-title" id="offcanvasWithBothOptionsLabel">Начало</h5>
				<button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
			</div>
			<div class="offcanvas-body">
				<div class="col-12">
					<div class="d-flex justify-content-between">
						<label for="xmlItemExample"  class="form-label">Образец &lt;item&gt;</label>						
					</div>
					<textarea name="" id="xmlItemExample" class="form-control" style="height: 300px;"></textarea>
					<div class="mt-2">
						<button class="btn btn-primary" type="button" id="runTabs">Далее</button>
					</div>
					
					
					
			</div>
			</div>
		</div>
	</aside>
	<main>
		<section class="top">
			<div class="container pt-3">
				
				<div class="row justify-content-between">
					<div class="mb-3 col">
					<button class="btn btn-warning" type="button" data-bs-toggle="offcanvas" data-bs-target="#offcanvasWithBothOptions" aria-controls="offcanvasWithBothOptions">Настройки</button>
					</div>
					<div class="mb-3 col-3">
						<label for="docName" class="form-label">Имя документа</label>
						<input type="text" class="form-control" id="docName" placeholder="WordpressImportFile">
						<div class="pt-2 d-flex justify-content-end">
							
							<button class="btn btn-secondary downloadXML">Скачать .xml</button>
						</div>
						
					</div>
				</div>

					
				
				
			</div>			
		</section>
		<section class="middle">
			<div class="container">
				<!--<div class="col-3 mb-3">
					<label for="varExample" class="form-label">Шаблон для поиска</label>

					<input type="text" class="form-control" id="varExample" placeholder="#">
					
				</div>-->
				
				<div class="row">
					
					<div class="col-12">
						<div class="d-flex justify-content-end">
							<button class="btn btn-primary" type="button" id="runPreview" data-bs-toggle="modal" data-bs-target="#modalPreview">Предварительный просмотр</button>
						</div>
						<div class="row align-items-start pt-2">
							<div class="nav flex-column nav-pills col-2" id="v-pills-tab" role="tablist" aria-orientation="vertical">					
							</div>
							<div class="tab-content col-10" id="v-pills-tabContent"></div>
					</div>
					</div>
				</div>
		</div>
		</section>
		<!--<section class="bottom">
			<div class="container pt-3">
				<p><i>Как я намучился с этой хуйней в эту прекрасную субботу...</i></p>
			</div>
			
		</section>-->
	</main>
	<!-- Modal -->
<div class="modal fade" id="modalPreview" tabindex="-1" aria-labelledby="modalPreviewLabel" aria-hidden="true">
	<div class="modal-dialog modal-dialog-scrollable">
	  <div class="modal-content">
		<div class="modal-header">
		  <h5 class="modal-title fs-5" id="modalPreviewLabel">Предварительный просмотр</h5>
		  <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
		</div>
		<div class="modal-body">
		  ...
		</div>
		<div class="modal-footer">
			<div class="mb-3 col-12">
				<label for="docName" class="form-label">Имя документа</label>
				<input type="text" class="form-control" id="docName" placeholder="WordpressImportFile">
				<div class="pt-2 d-flex justify-content-end">
					
					<button class="btn btn-secondary downloadXML">Скачать .xml</button>
				</div>
				
			</div>
		</div>
	  </div>
	</div>
  </div>
</body>
<!--Скрипты-->
<script src="/js/jquery-3.7.1.min.js"></script>
<script src="/js/bootstrap.bundle.min.js"></script>
<script src="/js/main.js"></script>
<!--end:Скрипты-->
</html>
